<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1f2e"/>

  <!-- Subtle topographic lines (faux contour pattern) -->
  <g stroke="#e5b54e" stroke-width="1" fill="none" opacity="0.05">
    <path d="M 0,400 Q 200,350 400,380 T 800,370 T 1200,390"/>
    <path d="M 0,440 Q 200,400 400,420 T 800,410 T 1200,430"/>
    <path d="M 0,480 Q 200,450 400,460 T 800,450 T 1200,470"/>
    <path d="M 0,520 Q 200,490 400,500 T 800,490 T 1200,510"/>
    <path d="M 0,560 Q 200,530 400,540 T 800,530 T 1200,550"/>
  </g>

  <!-- Radial glow from top-left -->
  <defs>
    <radialGradient id="glow" cx="0.1" cy="0.1" r="0.8">
      <stop offset="0%" stop-color="#e5b54e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#e5b54e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Radio wave icon (simplified, amber) -->
  <g transform="translate(100, 160)">
    <circle cx="72" cy="72" r="70" fill="#e5b54e" opacity="0.08"/>
    <circle cx="72" cy="72" r="50" fill="none" stroke="#e5b54e" stroke-width="2.5" opacity="0.4"/>
    <circle cx="72" cy="72" r="30" fill="none" stroke="#e5b54e" stroke-width="2.5" opacity="0.6"/>
    <circle cx="72" cy="72" r="12" fill="#e5b54e"/>
  </g>

  <!-- Title: English primary -->
  <text x="260" y="230" font-family="Geist, Inter, 'Helvetica Neue', Arial, sans-serif"
        font-size="72" font-weight="800" fill="#f6f3eb" letter-spacing="-2">
    Korea Ham Map
  </text>

  <!-- Korean subtitle -->
  <text x="260" y="290" font-family="'Malgun Gothic', 'Apple SD Gothic Neo', 'Pretendard', sans-serif"
        font-size="36" font-weight="500" fill="#a3adc2">
    중계기 · SOTA · POTA · LOS 분석
  </text>

  <!-- Tagline row (amber accent) -->
  <g transform="translate(260, 340)">
    <rect x="0" y="0" width="4" height="40" fill="#e5b54e"/>
    <text x="20" y="28" font-family="'SF Mono', 'Geist Mono', monospace"
          font-size="22" font-weight="700" fill="#e5b54e" letter-spacing="4">
      VHF · UHF · SOTA · POTA
    </text>
  </g>

  <!-- Footer stats strip -->
  <g transform="translate(100, 510)">
    <text x="0" y="0" font-family="'SF Mono', 'Geist Mono', monospace"
          font-size="18" fill="#7a8396" letter-spacing="2">150 REPEATERS</text>
    <text x="220" y="0" font-family="'SF Mono', 'Geist Mono', monospace"
          font-size="18" fill="#7a8396" letter-spacing="2">2457 SOTA</text>
    <text x="400" y="0" font-family="'SF Mono', 'Geist Mono', monospace"
          font-size="18" fill="#7a8396" letter-spacing="2">1269 POTA</text>
    <text x="600" y="0" font-family="'SF Mono', 'Geist Mono', monospace"
          font-size="18" fill="#7a8396" letter-spacing="2">LOS ANALYSIS</text>
  </g>

  <!-- Bottom brand line -->
  <text x="100" y="580" font-family="'SF Mono', 'Geist Mono', monospace"
        font-size="14" fill="#556677" letter-spacing="3">
    hamrini.github.io/Korea-UV-Repeater-Map
  </text>
</svg>