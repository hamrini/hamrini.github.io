<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1f2e"/>

  <!-- Subtle topographic lines (faux contour pattern) -->
  <g stroke="#e5b54e" stroke-width="1" fill="none" opacity="0.05">
    <path d="M 0,400 Q 200,350 400,380 T 800,370 T 1200,390"/>
    <path d="M 0,440 Q 200,400 400,420 T 800,410 T 1200,430"/>
    <path d="M 0,480 Q 200,450 400,460 T 800,450 T 1200,470"/>
    <path d="M 0,520 Q 200,490 400,500 T 800,490 T 1200,510"/>
    <path d="M 0,560 Q 200,530 400,540 T 800,530 T 1200,550"/>
  </g>

  <!-- Radial glow from top-left -->
  <defs>
    <radialGradient id="glow" cx="0.1" cy="0.1" r="0.8">
      <stop offset="0%" stop-color="#e5b54e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#e5b54e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- CQCQ.kr brand mark (matches public/brand/cqcq-mark.svg, scaled to 144px) -->
  <g transform="translate(100, 160) scale(2.25)">
    <!-- Faint outer pulse rings -->
    <circle cx="32" cy="32" r="40" fill="none" stroke="#e5b54e" stroke-width="0.8" opacity="0.18"/>
    <circle cx="32" cy="32" r="50" fill="none" stroke="#e5b54e" stroke-width="0.6" opacity="0.10"/>
    <!-- Amber badge body -->
    <circle cx="32" cy="32" r="29" fill="#e5b54e"/>
    <!-- CQ wordmark — Arial heavy, matches favicon for brand consistency.
         Body/title text below uses Pretendard. -->
    <text x="9" y="41" font-family="Arial, Helvetica, sans-serif"
          font-size="22" font-weight="900" fill="#1a1f2e" letter-spacing="-0.5">CQ</text>
    <!-- Radio wave arcs -->
    <g fill="none" stroke="#1a1f2e" stroke-linecap="round">
      <path d="M 44 28 A 4 4 0 0 1 44 36" stroke-width="2" stroke-opacity="0.9"/>
      <path d="M 47 25 A 7 7 0 0 1 47 39" stroke-width="1.7" stroke-opacity="0.55"/>
      <path d="M 50 22 A 10 10 0 0 1 50 42" stroke-width="1.4" stroke-opacity="0.30"/>
    </g>
    <!-- Top-left highlight -->
    <path d="M 14 22 A 22 22 0 0 1 38 12" fill="none"
          stroke="#fff" stroke-opacity="0.20" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Title: English primary -->
  <text x="260" y="230" font-family="Pretendard, 'Pretendard Variable', sans-serif"
        font-size="72" font-weight="800" fill="#f6f3eb" letter-spacing="-2">
    Korea Ham Map
  </text>

  <!-- Korean subtitle -->
  <text x="260" y="290" font-family="Pretendard, 'Pretendard Variable', sans-serif"
        font-size="36" font-weight="500" fill="#a3adc2">
    중계기 · SOTA · POTA · LOS 분석
  </text>

  <!-- Tagline row (amber accent) -->
  <g transform="translate(260, 340)">
    <rect x="0" y="0" width="4" height="40" fill="#e5b54e"/>
    <text x="20" y="28" font-family="Pretendard, 'Pretendard Variable', sans-serif"
          font-size="22" font-weight="700" fill="#e5b54e" letter-spacing="4">
      VHF · UHF · SOTA · POTA
    </text>
  </g>

  <!-- Footer stats strip -->
  <g transform="translate(100, 510)">
    <text x="0" y="0" font-family="Pretendard, 'Pretendard Variable', sans-serif"
          font-size="18" font-weight="500" fill="#7a8396" letter-spacing="2">150 REPEATERS</text>
    <text x="220" y="0" font-family="Pretendard, 'Pretendard Variable', sans-serif"
          font-size="18" font-weight="500" fill="#7a8396" letter-spacing="2">2457 SOTA</text>
    <text x="400" y="0" font-family="Pretendard, 'Pretendard Variable', sans-serif"
          font-size="18" font-weight="500" fill="#7a8396" letter-spacing="2">1269 POTA</text>
    <text x="600" y="0" font-family="Pretendard, 'Pretendard Variable', sans-serif"
          font-size="18" font-weight="500" fill="#7a8396" letter-spacing="2">LOS ANALYSIS</text>
  </g>

  <!-- Bottom brand line -->
  <text x="100" y="580" font-family="Pretendard, 'Pretendard Variable', sans-serif"
        font-size="14" font-weight="500" fill="#556677" letter-spacing="3">
    https://cqcq.kr | @cqcqmap
  </text>
</svg>